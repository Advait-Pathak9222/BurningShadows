known_design_choices:
  - responses are multi-claim paragraphs assembled from independently labelled clauses,
    so verification can be allocated over spans rather than over whole responses
  - every harmful clause carries an exact character span emitted by the generator from its
    own construction, never inferred from detector agreement
  - only 3.45% of characters carry harm, which is the opportunity paged verification targets
  - harm prevalence is held near 0.16 at the response level so allocation is a search problem
  - evidence availability is drawn independently of the label, so an absent source document
    carries no information about harm
  - every harm family emits loud and quiet realisations, so detector recall stays below one
  - clean decoy clauses (policy discussion, refusals, permitted PII, formatting drift) resemble
    the loud harmful forms, so detector precision stays below one
  - calibration and test are split i.i.d. within each route to preserve the exchangeability
    the conformal bound depends on
  - a novel exfiltration pattern appears only in the back third of the stream
