review:
  # Loaded reviewer rate and handling time from docs/03-assumptions.md. A review costs
  # 38x the most expensive automated check, which is why attention is budgeted separately.
  reviewer_cost_per_hour_inr: 1200
  minutes_per_case: 6
  # Reviewer minutes available per hour of traffic. Two reviewers on shift.
  capacity_minutes_per_hour: 120
  # Audit is stratified because uniform sampling wastes reviewer time. Rows the allocator
  # declined to check are the only place a miss is visible, and only about one in four
  # hundred of them carries harm, so they are sampled far harder than rows a detector
  # already scored.
  audit_rate_unchecked: 0.40
  audit_rate_checked: 0.04
  # Reviewer slots filled by uniform sampling rather than by the serving rule. This is
  # the price of being able to recalibrate at all: the queue serves by expected loss per
  # minute, so the labels it produces over-represent harm 37% against the 18.4% actually
  # present, and no stratum-level weight corrects selection happening inside a stratum.
  # Only randomly sampled rows and the fixed-rate audit have a computable inclusion
  # probability, and only those may fit a calibration map. Raising this buys labels and
  # spends queue performance; the attention report prices both sides.
  random_review_share: 0.20

controller:
  learning_rate: 0.35
  # Assurance rupees per served interaction the gateway aims to hold.
  gateway_budget_rate_inr: 0.75

tiers:
  0:
    verification_cost_inr: 0.02
    latency_ms: 4
    catch_rate:
      hallucination: 0.15
      pii_leak: 0.82
      bias: 0.08
      unsafe_content: 0.25
      injection_or_exfil: 0.70
  1:
    verification_cost_inr: 0.18
    latency_ms: 70
    catch_rate:
      hallucination: 0.68
      pii_leak: 0.90
      bias: 0.65
      unsafe_content: 0.78
      injection_or_exfil: 0.84
  2:
    verification_cost_inr: 3.20
    latency_ms: 900
    catch_rate:
      hallucination: 0.88
      pii_leak: 0.94
      bias: 0.83
      unsafe_content: 0.91
      injection_or_exfil: 0.91
delay_cost_per_ms_inr:
  read: 0.0000
  reversible_write: 0.0002
  irreversible_write: 0.0006
  financial: 0.0010
  external_facing: 0.0004

