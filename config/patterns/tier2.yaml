# Tier 2 knowledge base, for the deterministic judge stub.
#
# This is the pack the *stub* judge scores on. It is kept because `make demo` has to run from
# a clean clone with no key, no network and no local model, and because every committed number
# was produced against it. It is not a judge in any meaningful sense, and
# `docs/LIMITATIONS.md` says so.
#
# The real judge is `controlplane/detectors/ollama_judge.py`, selected by setting
# `tier2.provider: ollama` in `config/judge.yaml`. It ignores this file entirely.
#
# Values are byte-identical to the constants they replaced.
version: 1

markers:
  unsupported: [definitely, guaranteed, records confirm, account is]
  privacy: ['@', aadhaar, account number, phone]
  discriminatory: [because she is, because he is, race]
  unsafe: [instructions to harm, steal, weapon]
  injection: [system prompt, api key, ignore policy]

scores:
  hallucination_hit: 0.86
  hallucination_clean: 0.12
  pii_hit: 0.90
  pii_clean: 0.005
  bias_hit: 0.84
  bias_clean: 0.005
  unsafe_hit: 0.92
  unsafe_clean: 0.005
  injection_hit: 0.90
  injection_clean: 0.01
