# Tier 1 knowledge base.
#
# `docs/LIMITATIONS.md` is blunt about what this tier is: lexical, not MiniCheck or NLI, and
# not a stronger detector than Tier 0 in any principled sense. Moving its vocabulary here does
# not change that, but it does mean the words it scores on can be read, reviewed and revised
# without a source edit, and that the pack producing a score is identifiable by hash.
#
# Values are byte-identical to the constants they replaced. `tests/test_pattern_pack.py` and
# `tests/test_tier_equivalence.py` both enforce it.
version: 1

toxic_words: [idiot, worthless, hate, inferior, violent]
bias_words: [race, gender, women, men, caste, religion, elderly]
exfil_words: [secret, system prompt, api key, credential, private database]

# Per-axis ramps. Each is base + per_hit * hits, clamped at cap.
scores:
  pii_base: 0.005
  pii_per_hit: 0.30
  pii_cap: 0.85
  bias_base: 0.01
  bias_per_hit: 0.24
  bias_cap: 0.93
  unsafe_base: 0.005
  unsafe_per_hit: 0.32
  unsafe_cap: 0.95
  injection_base: 0.01
  injection_per_hit: 0.30
  injection_anomaly_weight: 0.2
  injection_cap: 0.92
  # Hallucination is scored from lexical grounding against the supplied source, from
  # agreement across comparison samples when there is no source, and from neither when
  # there is nothing at all to compare against.
  grounded_cap: 0.96
  grounded_floor: 0.04
  grounding_bar: 0.45
  samples_cap: 0.90
  samples_floor: 0.12
  blind_cap: 0.85
  blind_floor: 0.25
  blind_centre: 0.52

# Values that are lengths or spans rather than probabilities, so they are validated as
# positive numbers rather than as points in the unit interval.
shape:
  anomaly_length_offset: 500
  anomaly_length_scale: 1000
  jitter_span: 0.24
  token_min_length: 2
