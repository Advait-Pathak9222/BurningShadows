[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-ai"
version = "0.1.0"
description = "Budget-aware responsible AI verification prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "streamlit>=1.57,<2",
  "tabulate>=0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
models = [
  "presidio-analyzer>=2.2,<3",
  "transformers>=4.45,<6",
]
tracking = [
  "mlflow>=3,<4",
]

[project.scripts]
controlplane = "controlplane.cli:main"

[tool.setuptools.packages.find]
include = ["controlplane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:datetime.datetime.utcfromtimestamp.*:DeprecationWarning",
  "ignore:jsonschema.RefResolver is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["controlplane"]
exclude = ["console"]

[[tool.mypy.overrides]]
module = ["pandas", "yaml"]
ignore_missing_imports = true
