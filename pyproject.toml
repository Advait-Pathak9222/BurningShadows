[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-ai"
version = "0.1.0"
description = "Budget-aware responsible AI verification prototype"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "streamlit>=1.57,<2",
  "tabulate>=0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
# Optional, and never on the demo path. `presidio-analyzer` backs the Tier 0 PII adapter
# in `controlplane/detectors/presidio_pii.py` and needs a spaCy model installed separately:
#   pip install -e ".[models]" && python -m spacy download en_core_web_lg
# The adapter refuses to download that model itself. Presidio's default engine fetches
# 400 MB over the network on first use, and this prototype promises to run offline.
models = [
  "presidio-analyzer>=2.2,<3",
]
external = [
  "matplotlib>=3.8,<4",
  "pyarrow>=15,<23",
]
tracking = [
  "mlflow>=3,<4",
]

[project.scripts]
controlplane = "controlplane.cli:main"

[tool.setuptools.packages.find]
include = ["controlplane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:datetime.datetime.utcfromtimestamp.*:DeprecationWarning",
  "ignore:jsonschema.RefResolver is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
# Stub-parsing level only. numpy's shipped stubs use `type` statements that mypy refuses
# to parse below 3.12, which broke `make check` on a fresh clone. Runtime support stays at
# 3.11 (requires-python), and ruff's target-version enforces that for our own syntax.
python_version = "3.12"
strict = true
packages = ["controlplane"]
exclude = ["console"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed explicitly rather than
# globally silenced, and the optional ones are here because `make check` must give the
# same answer on a clean install as it does on a developer machine that happens to have
# the extras -- otherwise the advertised gate is only green where it was written.
module = [
  "pandas",
  "yaml",
  "matplotlib",
  "matplotlib.*",
  "pyarrow",
  "pyarrow.*",
  "mlflow",
  "mlflow.*",
  "spacy",
  "spacy.*",
  "presidio_analyzer",
  "presidio_analyzer.*",
  "streamlit",
  "streamlit.*",
]
ignore_missing_imports = true
