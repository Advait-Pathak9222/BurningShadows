<!-- title -->
<text x="60" y="46" font-size="30" font-weight="700" fill="#1A1422">ControlPlane</text>
<text x="300" y="46" font-size="23" fill="#554D60">One gateway in front of any model. Every answer gets a priced decision and a receipt.</text>
<rect x="60" y="60" width="1920" height="3" fill="#A100FF"/>

<text x="1484" y="304" text-anchor="middle" font-size="16" fill="#6E6478">is it worth buying</text>

<rect x="1206" y="336" width="354" height="52" rx="8" fill="#1A1422"/>
<text x="1383" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#05F2DB" font-family="Consolas,monospace">r&#215;c&#215;k &#62; (1+&#955;)(v+d)</text>

<text x="1383" y="418" text-anchor="middle" font-size="17" font-weight="600" fill="#450073">The floor wins when the two disagree</text>
<text x="1383" y="440" text-anchor="middle" font-size="16" fill="#554D60">a budget can never switch it off</text>

<line x1="1596" y1="308" x2="1638" y2="308" stroke="#9A93A6" stroke-width="2.6" marker-end="url(#ar)"/>

<text x="1760" y="348" font-size="17" font-weight="600" fill="#1A1422">Words stream now</text>
<text x="1760" y="370" font-size="16" fill="#6E6478">nobody waits on a verdict</text>
<text x="1760" y="398" font-size="17" font-weight="600" fill="#8A1E4D">Only the action waits</text>

<!-- ============== AUDIT LOOP ============== -->
<rect x="230" y="516" width="1750" height="118" rx="10" fill="#FFF9F2" stroke="#E2A15A" stroke-width="2"/>
<g transform="translate(268,538)"><use href="#i-people"/></g>
<text x="378" y="568" font-size="20" font-weight="700" fill="#8A5200">5   THE LOOP</text>
<text x="378" y="596" font-size="17" fill="#8A5200">People review a slice of traffic every day, including answers nobody checked.</text>
<text x="378" y="620" font-size="17" fill="#8A5200">Their verdicts retrain the calibrator, re price the checks, and move the floor.</text>

<path d="M1810 470 L1810 494 L1500 494 L1500 512" fill="none" stroke="#E2653A" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#aro)"/>
<text x="1524" y="508" font-size="16" fill="#8A5200" font-style="italic">every decision is logged</text>

<path d="M1048 516 L1048 474" fill="none" stroke="#E2653A" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#aro)"/>
<text x="1032" y="500" text-anchor="end" font-size="16" fill="#8A5200" font-style="italic">retrains the calibrator</text>

<path d="M1282 516 L1282 474" fill="none" stroke="#E2653A" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#aro)"/>
<text x="1300" y="500" font-size="16" fill="#8A5200" font-style="italic">moves the floor</text>

<!-- footer -->
<text x="60" y="694" font-size="19" fill="#554D60">Stages one to four run on the request. Stage five runs overnight.</text>
<text x="60" y="724" font-size="19" fill="#554D60">The gateway sees only what went in and what came out, so it works in front of a model an enterprise rents rather than owns.</text>
<text x="60" y="766" font-size="19" font-weight="700" fill="#450073">Text is never delayed. Money and data are gated separately, and every decision is recomputable from its own record.</text>
